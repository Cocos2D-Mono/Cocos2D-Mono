name: unit-tests

on:
  push:
    branches: [ dev, master ]
  pull_request:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (DesktopGL / net10.0)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      # With global.json's rollForward, a newer SDK on the runner image wins over the
      # one installed above, so log the SDK that builds.
      - name: Show the .NET SDK version
        run: dotnet --version
      - name: Test
        # Overriding the Cocos2DTargetFrameworks dial narrows the referenced
        # multi-target src/Cocos2DMono to the tested TFM so restore does not
        # require the android/ios workloads on this runner. (A global
        # TargetFrameworks property would also poison the single-TFM test
        # project itself and break test discovery - the dial is scoped to the
        # src/ projects that consume it.)
        run: dotnet test Tests/Cocos2DMono.UnitTests/Cocos2DMono.UnitTests.csproj -c Release -p:Cocos2DTargetFrameworks=net10.0
