name: Trigger Docs Site Rebuild

on:
  push:
    branches: [master]

jobs:
  notify-docs-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger the Cocos2D-Mono.Docs rebuild
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.DOCS_REPO_PAT }}
          repository: Cocos2D-Mono/Cocos2D-Mono.Docs
          event-type: update-docs
          client-payload: '{"source":"Cocos2D-Mono/cocos2d-mono", "ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
